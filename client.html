<html>
<head>
    <title>WebSocket</title>
    <style type="text/css">
        html, body {
            font: normal 0.9em arial, helvetica;
        }
        #log {
            width: 600px;
            height: 300px;
            border: 1px solid #7F9DB9;
            overflow: auto;
        }
        #msg {
            width: 400px;
        }
    </style>
    <script type="text/javascript">
        var socket;

        function init() {
            var host = "ws://127.0.0.1:9000";
            try {
                socket = new WebSocket(host);
                log('WebSocket - status ' + socket.readyState);
                socket.onopen = function(msg) {
                    log("Bienvenido - status " + this.readyState);
                };
                socket.onmessage = function(msg) {
                    log(msg.data); // Mensaje ya formateado con alias en el servidor
                };
                socket.onclose = function(msg) {
                    log("Desconectado - status " + this.readyState);
                };
            } catch (ex) {
                log(ex);
            }
            $("msg").focus();
        }

        function send() {
            var alias = $("alias").value.trim();
            var txt = $("msg").value.trim();
            if (!alias) {
                alert("Por favor, ingrese un alias.");
                return;
            }
            if (!txt) {
                alert("El mensaje no puede estar vacío.");
                return;
            }

            var messageData = JSON.stringify({ alias: alias, message: txt });

            try {
                socket.send(messageData);
                $("msg").value = "";
                $("msg").focus();
            } catch (ex) {
                log(ex);
            }
        }

        function quit() {
            if (socket != null) {
                log("Adiós!");
                socket.close();
                socket = null;
            }
        }

        function reconnect() {
            quit();
            init();
        }

        // Utilidades
        function $(id) {
            return document.getElementById(id);
        }

        function log(msg) {
            $("log").innerHTML += "<br>" + msg;
        }

        function onkey(event) {
            if (event.keyCode == 13) {
                send();
            }
        }
    </script>
</head>
<body onload="init()">
    <h3>WebSocket v2.00</h3>
    <div id="log"></div>
    <label>Alias: <input id="alias" type="text" /></label>
    <br><br>
    <input id="msg" type="text" onkeypress="onkey(event)" />
    <button onclick="send()">Enviar</button>
    <button onclick="quit()">Salir</button>
    <button onclick="reconnect()">Reconectar</button>
</body>
</html>
